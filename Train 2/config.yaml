# Default configuration
buckets_minutes: [1, 5, 15]
thresholds:
  risk_alert: 0.85
  regression_high_density: 0.80
latency_target_ms: 200
lightgbm:
  learning_rate: 0.05
  num_leaves: 64
  feature_fraction: 0.9
  bagging_fraction: 0.8
  bagging_freq: 1
  max_depth: -1
  lambda_l1: 0.0
  lambda_l2: 0.0
  min_data_in_leaf: 50
training:
  num_boost_round: 1000
  early_stopping_rounds: 100
  seed: 42
  cv_folds: 5
serve:
  host: 0.0.0.0
  port: 8000
  websocket_path: /stream_updates
feature_store:
  redis_url: redis://localhost:6379/0
  ttl_seconds: 7200
